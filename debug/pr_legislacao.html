function efetuarLoginSentinela(){		
		if(window.document.formLogin){		
				var chave = window.document.formLogin.CHAVE;		
				if (chave.value.replace(/^[\s]+/g,'') == '') {			
					alert('Informe o campo Usu&aacute;rio!');		
						chave.focus(); 
						return false; 
				}	
				var senha = window.document.formLogin.CHAVE_ENCRIPT;
				if (senha.value.replace(/^[\s]+/g,'') == '') {
						alert('Informe o campo Senha!'); 
						senha.focus(); 
						return false; 
				}
				window.document.formLogin.SENTINELA.value='SENTINELA_REQUEST_LOGIN';		
				execDigester();		
				return true;	
		}	
		else{		
				return false;	
		}	
}
function esqueciSenha(){
	if(window.document.formLogin){
		window.document.formLogin.SENTINELA.value="SENTINELA_REQUEST_LOST_PASSWORD";
		window.document.formLogin.submit();
	}
}

 		if(window.document.formLogin){

function efetuarTrocaSenha(){
	if(window.document.formLogin){
		var senhaatual = window.document.formLogin.SENHA_ATUAL;
		var senhanova = window.document.formLogin.NEW_SENHA;
		var senhanova2 = window.document.formLogin.NEW_SENHA_CONF;
		var chave = window.document.formLogin.CHAVE;
		if (chave.value.replace(/^[\s]+/g,'') == '') {
		alert('Informe o campo Usu&aacute;rio!'); chave.focus(); return false; }
		if (senhaatual.value.replace(/^[\s]+/g,'') == '') {
			alert('Informe o campo Senha!'); senhaatual.focus(); return false; }
		if (senhanova.value.replace(/^[\s]+/g,'') == '') {
			alert('Informe o campo Nova Senha!'); senhanova.focus(); return false; }
		if (senhanova2.value.replace(/^[\s]+/g,'') == '') {
			alert('Informe o campo Redigite Senha!'); senhanova2.focus(); return false; }
		if (senhaatual.value == senhanova.value) {
			alert('Valor do campo Nova Senha deve ser diferente do valor do campo Senha!'); senhanova.focus(); return false;}
		if (senhanova.value != senhanova2.value) {
			alert('Valores dos campos Nova Senha e Redigite Senha são diferentes!'); senhanova.focus(); return false;}
		return true;
	}else{
		return false;
	}
}
function efetuarEsqueciSenha(){
	if(window.document.formLogin){
		var chave = window.document.formLogin.CHAVE;
		if (chave.value.replace(/^[\s]+/g,'') == '') {
		alert('Informe o campo Usu&aacute;rio!'); chave.focus(); return false; }
		var cpf = window.document.formLogin.CPF;
		if (cpf.value.replace(/^[\s]+/g,'') == '') {
			alert('Informe o campo CPF!'); cpf.focus(); return false; }
		return true;
	}else{
		return false;
	}
}
function execDigester(){

	if(window.document.formLogin){
	var pass = window.document.formLogin.CHAVE_ENCRIPT.value;
	var login = window.document.formLogin.CHAVE.value;
	var code = "148db2c2-43d5-421d-a3f8-d16038279178";
	var key = hex_md5(login + pass);
	key = code + key;
	var out = hex_md5(key);
	window.document.formLogin.CHAVE_ENCRIPT.value = out;
	}
		return false;
}

function md5_cmn(q, a, b, x, s, t){
 return safe_add(bit_rol(safe_add(safe_add(a, q), safe_add(x, t)), s),b);
}
function md5_ff(a, b, c, d, x, s, t){
 return md5_cmn((b & c) | ((~b) & d), a, b, x, s, t);
}
function md5_gg(a, b, c, d, x, s, t){
 return md5_cmn((b & d) | (c & (~d)), a, b, x, s, t);
}
function md5_hh(a, b, c, d, x, s, t){
 return md5_cmn(b ^ c ^ d, a, b, x, s, t);
}
function md5_ii(a, b, c, d, x, s, t){
 return md5_cmn(c ^ (b | (~d)), a, b, x, s, t);
}
function core_hmac_md5(key, data){
  var bkey = str2binl(key);  if(bkey.length > 16) bkey = core_md5(bkey, key.length * chrsz);  var ipad = Array(16), opad = Array(16);  for(var i = 0; i < 16; i++){    ipad[i] = bkey[i] ^ 0x36363636;    opad[i] = bkey[i] ^ 0x5C5C5C5C;  }  var hash = core_md5(ipad.concat(str2binl(data)), 512 + data.length * chrsz);  return core_md5(opad.concat(hash), 512 + 128);}
function safe_add(x, y){
  var lsw = (x & 0xFFFF) + (y & 0xFFFF), msw = (x >> 16) + (y >> 16) + (lsw >> 16);  return (msw << 16) | (lsw & 0xFFFF);}
function bit_rol(num, cnt){
 return (num << cnt) | (num >>> (32 - cnt));}
function str2binl(str){
  var bin = Array(), mask = (1 << chrsz) - 1;  for(var i = 0; i < str.length * chrsz; i += chrsz)    bin[i>>5] |= (str.charCodeAt(i / chrsz) & mask) << (i%32);  return bin;}
function binl2str(bin){
  var str = "", mask = (1 << chrsz) - 1;  for(var i = 0; i < bin.length * 32; i += chrsz)    str += String.fromCharCode((bin[i>>5] >>> (i % 32)) & mask);  return str;}
function binl2hex(binarray){
  var hex_tab = hexcase ? "0123456789ABCDEF" : "0123456789abcdef", str = "";  for(var i = 0; i < binarray.length * 4; i++){
    str += hex_tab.charAt((binarray[i>>2] >> ((i%4)*8+4)) & 0xF) +           hex_tab.charAt((binarray[i>>2] >> ((i%4)*8  )) & 0xF);  }
  return str;}
function binl2b64(binarray){
  var tab = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/",str = "";  for(var i = 0; i < binarray.length * 4; i += 3){
    var triplet = (((binarray[i   >> 2] >> 8 * ( i   %4)) & 0xFF) << 16)                | (((binarray[i+1 >> 2] >> 8 * ((i+1)%4)) & 0xFF) << 8 )                |  ((binarray[i+2 >> 2] >> 8 * ((i+2)%4)) & 0xFF);
  for(var j = 0; j < 4; j++){
      if(i * 8 + j * 6 > binarray.length * 32) str += b64pad;      else str += tab.charAt((triplet >> 6*(3-j)) & 0x3F);    }
  }
  return str;
}
