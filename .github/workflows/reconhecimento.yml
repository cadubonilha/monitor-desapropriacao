# Execução manual: grava em debug/ o HTML real dos portais para desenvolvimento
# dos raspadores diretos. Não interfere na coleta diária.
name: Reconhecimento de portais

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconhecer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/reconhecimento.py
      - name: Publicar debug/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/
          git diff --cached --quiet || git commit -m "debug: reconhecimento de portais $(date +%F)"
          git pull --rebase --autostash && git push
